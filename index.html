<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f6f4" />
    <title>Hometown</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand"><span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span><div><strong>Hometown</strong><small>房屋三维模型</small></div></div>
        <div class="top-actions">
          <span class="status"><span class="status-dot"></span>可漫游模型</span>
          <button id="reference-button" class="icon-button" type="button" title="查看原始户型图" aria-label="查看原始户型图"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg></button>
          <button id="fullscreen-button" class="icon-button" type="button" title="全屏查看" aria-label="全屏查看"><svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3m13-5v3a2 2 0 0 1-2 2h-3"/></svg></button>
        </div>
      </header>
      <main class="workspace">
        <section class="viewer" aria-label="房屋三维查看器">
          <div id="canvas-host"></div>
          <div class="viewer-top">
            <div class="view-switch" role="group" aria-label="视角">
              <button class="view-button active" data-view="3d" type="button">立体</button>
              <button class="view-button" data-view="top" type="button">俯视</button>
              <button class="view-button" data-view="walk" type="button">漫游</button>
            </div>
            <button id="reset-button" class="secondary-button" type="button" title="重置视角"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg><span>重置视角</span></button>
          </div>
          <div id="room-labels" class="room-labels hide-rooms"></div>
          <div id="walk-room" class="walk-room" hidden></div>
          <div id="walk-pad" class="walk-pad" hidden role="group" aria-label="漫游移动方向">
            <button type="button" data-move="forward" aria-label="向前移动" title="向前移动">↑</button>
            <button type="button" data-move="left" aria-label="向左移动" title="向左移动">←</button>
            <button type="button" data-move="backward" aria-label="向后移动" title="向后移动">↓</button>
            <button type="button" data-move="right" aria-label="向右移动" title="向右移动">→</button>
          </div>
          <div class="viewer-zoom" role="group" aria-label="缩放">
            <button id="zoom-in-button" type="button" aria-label="放大" title="放大">+</button>
            <button id="zoom-out-button" type="button" aria-label="缩小" title="缩小">-</button>
          </div>
          <div class="compass" aria-label="方向"><span class="compass-n">北</span><span class="compass-e">东</span><span class="compass-s">南</span><span class="compass-w">西</span><span class="compass-center"></span></div>
          <div class="viewer-bottom"><div class="scale-line"><span></span>2 m</div><div class="interaction-hint">拖动旋转 · 滚轮缩放 · 右键平移</div></div>
        </section>
        <aside class="sidebar">
          <div class="sidebar-heading"><div class="eyebrow">HOMETOWN / 3D MODEL</div><h1>房屋概览</h1><p>依据户型图还原的房屋布局与陈设</p></div>
          <div class="stat-row"><div><span>建筑外轮廓</span><strong>8.58 × 13.16 <small>m</small></strong></div><div><span>外轮廓估算面积</span><strong>约 113 <small>m²</small></strong></div></div>
          <div class="section-rule"></div>
          <div class="control-section room-navigation"><div class="section-title">进入房间</div><div class="room-entry"><select id="room-select" aria-label="选择房间"></select><button id="enter-room" type="button">进入</button></div></div>
          <div class="section-rule"></div>
          <div class="control-section"><div class="section-title">模型参数</div><div class="range-head"><span>结构墙高</span><strong>约 4.14 m</strong></div><div class="range-head"><span>东西卧室吊顶</span><strong>约 3.27 m</strong></div><div class="range-head"><span>客厅吊顶</span><strong>约 3.44 m</strong></div></div>
          <div class="section-rule"></div>
          <div class="control-section"><div class="section-title">显示内容</div><label class="toggle-row"><span><i class="legend-dot wall-dot"></i>墙体</span><input id="walls-toggle" type="checkbox" checked><i class="switch"></i></label><label class="toggle-row"><span><i class="legend-dot floor-dot"></i>地面</span><input id="floor-toggle" type="checkbox" checked><i class="switch"></i></label><label class="toggle-row"><span><i class="legend-dot label-dot"></i>房间标签</span><input id="labels-toggle" type="checkbox"><i class="switch"></i></label><label class="toggle-row"><span><i class="legend-dot dimensions-dot"></i>尺寸标注</span><input id="dimensions-toggle" type="checkbox"><i class="switch"></i></label></div>
          <div class="section-rule"></div>
          <div class="note"><div class="note-icon">i</div><div><strong>建模依据</strong><p>室外墙为水泥原色，室内墙为大白墙。西卧室、客厅和阳台铺 0.80 m 地砖，洗澡间铺 0.30 m 地砖，其余为水泥地面。</p></div></div>
          <div class="export-actions">
            <button id="download-button" class="download-button" type="button"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>导出当前视图</button>
            <button id="export-model-button" class="download-button export-model-button" type="button"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>导出模型（GLB）</button>
            <div id="export-status" class="export-status" role="status" aria-live="polite"></div>
          </div>
        </aside>
      </main>
      <dialog id="reference-dialog" class="reference-dialog"><div class="dialog-head"><div><strong>原始户型图</strong><span>floor-plan.png</span></div><button id="close-reference" class="icon-button" type="button" title="关闭" aria-label="关闭"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div><div class="reference-image-wrap"><img src="./floor-plan.png" alt="原始户型图"></div></dialog>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
